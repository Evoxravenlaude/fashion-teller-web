<main id="main" class="app">
  <section class="app-head">
    <div class="wrap">
      <div class="sec-head" style="margin-bottom:0;align-items:end">
        <div><h1 class="h2 split" id="wTitle">Workshop</h1><p class="body rv" id="wSub"></p></div>
        <div class="tabs rv" id="wTabs" role="tablist"><button type="button" role="tab" data-tab="requests">Requests <i class="count" id="cReq"></i></button><button type="button" role="tab" data-tab="quotes">My quotes</button><button type="button" role="tab" data-tab="orders">Orders <i class="count" id="cOrd"></i></button><button type="button" role="tab" data-tab="profile">Profile</button></div>
      </div>
    </div>
  </section>
  <section class="sec tight">
    <div class="wrap" id="wRoot">
      <div id="wBanner"></div>
      <div data-panel="requests"><div class="loading"><span class="spin"></span></div></div>
      <div data-panel="quotes" hidden></div>
      <div data-panel="orders" hidden></div>
      <div data-panel="profile" hidden></div>
    </div>
  </section>
</main>
